apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix-v3
  namespace: argocd
spec:
  destination:
    namespace: v3-apisix
    server: https://kubernetes.default.svc
  project: default
  source:
    path: charts/apisix
    repoURL: https://github.com/ArnaudCHT/test-argo.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
      allowEmpty: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
